<svg xmlns="http://www.w3.org/2000/svg" width="860" height="368" viewBox="0 0 860 368" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13">
<rect width="860" height="368" rx="12" fill="#0f172a"/>
<text x="24" y="38" font-size="17" font-weight="600" fill="#e2e8f0">Every SMS carries 140 octets of user data</text>
<text x="24" y="60" fill="#94a3b8">GSM 7-bit: 160 septets fit one SMS. A split message spends 7 septets per part on its header, leaving 153.</text>
<text x="24" y="99" font-weight="600" fill="#e2e8f0">Single SMS</text>
<text x="24" y="115" font-size="12" fill="#94a3b8">up to 160 septets</text>
<rect x="190" y="84" width="640" height="34" rx="4" fill="#1e293b" stroke="#334155"/>
<rect x="190.0" y="84" width="640.0" height="34" rx="4" fill="#38bdf8"/>
<text x="510.0" y="106" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">160 septets × 7 bits = 1120 bits</text>
<text x="24" y="153" font-weight="600" fill="#e2e8f0">Part 1 of 2</text>
<text x="24" y="169" font-size="12" fill="#94a3b8">UDL 160 = 7 + 153 septets</text>
<rect x="190" y="138" width="640" height="34" rx="4" fill="#1e293b" stroke="#334155"/>
<rect x="190.0" y="138" width="27.4" height="34" rx="4" fill="#fbbf24"/>
<text x="203.7" y="160" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">UDH</text>
<rect x="217.4" y="138" width="2.6" height="34" rx="4" fill="#f87171"/>
<rect x="220.0" y="138" width="610.0" height="34" rx="4" fill="#38bdf8"/>
<text x="525.0" y="160" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">153 septets of text</text>
<text x="24" y="203" font-weight="600" fill="#e2e8f0">Part 2 of 2</text>
<text x="24" y="219" font-size="12" fill="#94a3b8">UDL 49 = 7 + 42 septets</text>
<rect x="190" y="188" width="640" height="34" rx="4" fill="#1e293b" stroke="#334155"/>
<rect x="190.0" y="188" width="27.4" height="34" rx="4" fill="#fbbf24"/>
<text x="203.7" y="210" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">UDH</text>
<rect x="217.4" y="188" width="2.6" height="34" rx="4" fill="#f87171"/>
<rect x="220.0" y="188" width="166.0" height="34" rx="4" fill="#38bdf8"/>
<text x="303.0" y="210" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">42 septets of text</text>
<text x="24" y="256" font-weight="600" fill="#e2e8f0">UDH of part 1</text>
<rect x="190" y="240" width="40" height="26" rx="4" fill="#1e293b" stroke="#fbbf24"/>
<text x="210.0" y="258" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" fill="#fbbf24">05</text>
<text x="210.0" y="282" text-anchor="middle" font-size="11" fill="#94a3b8">UDHL</text>
<rect x="236" y="240" width="40" height="26" rx="4" fill="#1e293b" stroke="#fbbf24"/>
<text x="256.0" y="258" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" fill="#fbbf24">00</text>
<text x="256.0" y="282" text-anchor="middle" font-size="11" fill="#94a3b8">IEI</text>
<rect x="282" y="240" width="40" height="26" rx="4" fill="#1e293b" stroke="#fbbf24"/>
<text x="302.0" y="258" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" fill="#fbbf24">03</text>
<text x="302.0" y="282" text-anchor="middle" font-size="11" fill="#94a3b8">IEL</text>
<rect x="328" y="240" width="40" height="26" rx="4" fill="#1e293b" stroke="#fbbf24"/>
<text x="348.0" y="258" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" fill="#fbbf24">2A</text>
<text x="348.0" y="282" text-anchor="middle" font-size="11" fill="#94a3b8">ref</text>
<rect x="374" y="240" width="40" height="26" rx="4" fill="#1e293b" stroke="#fbbf24"/>
<text x="394.0" y="258" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" fill="#fbbf24">02</text>
<text x="394.0" y="282" text-anchor="middle" font-size="11" fill="#94a3b8">total</text>
<rect x="420" y="240" width="40" height="26" rx="4" fill="#1e293b" stroke="#fbbf24"/>
<text x="440.0" y="258" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" fill="#fbbf24">01</text>
<text x="440.0" y="282" text-anchor="middle" font-size="11" fill="#94a3b8">part</text>
<text x="476" y="251" font-size="12" fill="#94a3b8">element 00: concatenated SMS</text>
<text x="476" y="268" font-size="12" fill="#94a3b8">ref 0x2A, part 1 of 2</text>
<rect x="24" y="302" width="12" height="12" rx="2" fill="#38bdf8"/>
<text x="42" y="313" font-size="12" fill="#94a3b8">text septets</text>
<rect x="145.2" y="302" width="12" height="12" rx="2" fill="#fbbf24"/>
<text x="163.2" y="313" font-size="12" fill="#94a3b8">concatenation header (6 octets)</text>
<rect x="391.79999999999995" y="302" width="12" height="12" rx="2" fill="#f87171"/>
<text x="409.79999999999995" y="313" font-size="12" fill="#94a3b8">fill bit</text>
<text x="24" y="332" font-size="12" fill="#94a3b8">smspdu::count() for this 195-character text: 195/306, 2 parts. UCS-2 (Arabic, emoji): 70 units, then 67 per part.</text>
<text x="24" y="350" font-size="12" fill="#94a3b8">A part never ends between ESC and its character, or inside a UTF-16 surrogate pair.</text>
</svg>
